name: Build sm8350 Star + BakaSU
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: 安装编译依赖（含 lld）
        run: |
          sudo apt update
          sudo apt install -y git build-essential libssl-dev bc bison flex libelf-dev zip unzip python3 cpio lld ccache
          git config --global http.postBuffer 524288000

      - name: 拉取内核源码，不加载自带KernelSU子模块
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: 生成版本信息
        id: version_info
        run: |
          BUILD_DATE=$(date +%Y%m%d-%H%M)
          GIT_SHORT=$(git rev-parse --short HEAD)
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "GIT_SHORT=${GIT_SHORT}" >> $GITHUB_OUTPUT
          echo "ZIP_NAME=BakaSU-Star-${BUILD_DATE}-${GIT_SHORT}.zip" >> $GITHUB_OUTPUT

      - name: 清理旧 KernelSU / BakaSU 残留
        run: |
          rm -rf drivers/kernelsu drivers/kernel-su BakaSU KernelSU
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernel-su/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true
          sed -i '/kernel-su/d' drivers/Kconfig || true
          # 额外清理常见KSU补丁痕迹
          find . -type f -name "*.patch" -exec grep -l "kernelsu" {} \; | xargs rm -f || true

      - name: 配置 ccache 加速
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-sm8350-star-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-sm8350-star-
        env:
          CCACHE_DIR: ~/.cache/ccache

      - name: 拉取并执行 BakaSU setup.sh
        run: |
          curl --retry 5 --connect-timeout 15 --max-time 80 -LSs "https://gh-proxy.com/https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash

      - name: 编译 Star 内核
        run: |
          bash build_device.sh star
        env:
          CCACHE_DIR: ~/.cache/ccache
          CCACHE_MAXSIZE: 20G

      - name: 校验内核镜像是否编译成功
        run: |
          if [ ! -f out_star/arch/arm64/boot/Image ]; then
            echo "❌ Image 编译失败，不存在 out_star/arch/arm64/boot/Image"
            exit 1
          fi

      - name: 下载 AnyKernel3 模板
        run: |
          curl --retry 3 -L -o AnyKernel3.zip "https://gh-proxy.com/https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip"
          unzip -q AnyKernel3.zip
          mv AnyKernel3-master AnyKernel

      - name: 拷贝内核镜像 + 打包 AnyKernel 刷机包
        run: |
          cp out_star/arch/arm64/boot/Image AnyKernel/zImage
          cd AnyKernel
          zip -r ../${{ steps.version_info.outputs.ZIP_NAME }} ./*

      - name: 上传 AnyKernel 刷机包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version_info.outputs.ZIP_NAME }}
          path: ${{ steps.version_info.outputs.ZIP_NAME }}
