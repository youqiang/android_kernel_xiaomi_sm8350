name: Build sm8350 Star + BakaSU
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y git build-essential libssl-dev bc bison flex libelf-dev zip unzip python3 cpio

      - name: 拉取内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 清理旧SU残留（KSU/SukiSU/旧BakaSU）
        run: |
          rm -rf drivers/kernelsu drivers/kernel-su BakaSU KernelSU
          sed -i '/kernelsu/d' drivers/Makefile || true
          sed -i '/kernel-su/d' drivers/Makefile || true
          sed -i '/kernelsu/d' drivers/Kconfig || true
          sed -i '/kernel-su/d' drivers/Kconfig || true

      - name: 集成最新 BakaSU（builtin）
        run: |
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash

      - name: 编译 Star 内核
        run: |
          bash build_device.sh star

      - name: 搜寻 AnyKernel 刷机包
        id: find_ak
        run: |
          ZIP=$(find . -maxdepth 3 -name "*AnyKernel*.zip" | head -n1)
          echo "ZIP=$ZIP" >> $GITHUB_OUTPUT
          ls -la $ZIP

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: sm8350-star-bakasu
          path: ${{ steps.find_ak.outputs.ZIP }}
